# Verification Pipeline
#
# 4 layers of verification, each catching what the previous one can't:
#
# Layer 1: Build + Lint + Types    → catches syntax/type errors (seconds)
# Layer 2: Unit Tests              → catches logic errors (seconds)
# Layer 3: Invariant Tests         → catches property violations (seconds)
# Layer 4: QA.tech E2E             → catches UX/behavioral issues (~5 min)

name: Verification Pipeline

on:
  pull_request:

env:
  NODE_VERSION: "20"

jobs:
  # ──────────────────────────────────────────────
  # Layer 1: Build + Lint + Types
  # Always on. The baseline.
  # ──────────────────────────────────────────────
  layer-1-build:
    name: "Layer 1: Build + Lint + Types"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
        name: Type check
      - run: npm run lint
        name: Lint
      - run: npm run build
        name: Build

  # ──────────────────────────────────────────────
  # Layer 2: Unit Tests
  # Tests for specific features and logic.
  # ──────────────────────────────────────────────
  layer-2-unit-tests:
    name: "Layer 2: Unit Tests"
    runs-on: ubuntu-latest
    needs: layer-1-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit
        name: Run unit tests

  # ──────────────────────────────────────────────
  # Layer 3: Invariant Tests
  # Property-based checks that must ALWAYS hold.
  # ──────────────────────────────────────────────
  layer-3-invariants:
    name: "Layer 3: Invariant Tests"
    runs-on: ubuntu-latest
    needs: layer-1-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:invariants
        name: Run invariant tests

  # ──────────────────────────────────────────────
  # Layer 4: QA.tech E2E Verification
  # AI testing agent verifies the app in a real browser.
